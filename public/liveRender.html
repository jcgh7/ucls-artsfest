<!DOCTYPE html>
<html>
<!-- worst code i've ever written holy-->

<head>
    <title>U-High Artsfest</title>
    <link rel="stylesheet" href="./src/styles.css">
    <script type="module" src="./src/main.js"></script>
    <script type="module">
        import { getCurrentUser, liveRead, writeLoc, getUser, current, staticRead, getCookie} from "./src/main.js";
        async function handleSignup(data, status) {

            writeLoc("new/workshops/" + data + "/signups-users", getCookie("uid"), status);
            if(status == 1){
                writeLoc("new/workshops/" + data, "signups", (await staticRead("new/workshops/" + data + "/signups"))-1);
            }
            else{
                writeLoc("new/workshops/" + data, "signups", (await staticRead("new/workshops/" + data + "/signups"))+1);
            }
        }
        function renderWorkshops(data) {
            document.getElementById("p1").innerHTML = "";
            document.getElementById("p2").innerHTML = "";
            document.getElementById("p3").innerHTML = "";
            document.getElementById("p4").innerHTML = "";
            let uid = getCookie("uid");
            let userPeriods = [false, false, false, false]; //p1, p2, p3, p12
            Object.keys(data).forEach(name => {
                let workshopDetails = Object.values(data[name]);
                let period = workshopDetails[3];
                let signupsUsers = workshopDetails[5];
                if (signupsUsers != undefined) {
                    Object.entries(signupsUsers).forEach(([user, value]) => {
                        if (user == uid && value == 0) {
                            userPeriods[period - 1] = true;
                            if (period == 4) {
                                userPeriods[0] = true;
                                userPeriods[1] = true;
                            }
                            if (period == 1 || period == 2){
                                userPeriods[3] = true;
                            }
                        }
                    }
                    );
                }
            })
            Object.keys(data).forEach(name => {
                let workshopDetails = Object.values(data[name]);
                let title = name;
                let capacity = workshopDetails[0];
                let description = workshopDetails[1];
                let location = workshopDetails[2];
                let period = workshopDetails[3];
                let periodRender = workshopDetails[3];
                let signups = workshopDetails[4];
                let signupsUsers = workshopDetails[5];
                if (period == 4) {
                    periodRender = "1 & 2";
                }
                let render = "";
                if (signupsUsers != undefined) {
                    Object.entries(signupsUsers).forEach(([user, value]) => {
                        if (user == uid && value == 0) {
                            render = `<div class="box">
                            <h1>${title}</h1>
                            <div style="color:grey;font-size:20px;margin-top:20px">
                                <b>Period: ${periodRender}</b>
                                <br>
                                <b>Location: ${location}</b>
                                <br><br>
                                <b style="color:black;font-size:30px">Signups: ${signups}/${capacity}</b>
                                <br>
                                <button style="font-size:25px" class='signupTrigger' id='${title}' data-title='${title}' data-status=1 type='button'>Remove signup</button>
                            </div>
                            </div>`;
                        }
                    });
                }
                if (userPeriods[period-1] && render == "") {
                    render = `<div class="box">
                    <h1>${title}</h1>
                    <div style="color:grey;font-size:20px;margin-top:20px">
                        <b>Period: ${periodRender}</b>
                        <br>
                        <b>Location: ${location}</b>
                        <br><br>
                        <b style="color:black;font-size:30px">Signups: ${signups}/${capacity}</b>
                    </div>
                    </div>`;
                }
                else if (signups < capacity && render == "") {
                    render = `<div class="box">
                    <h1>${title}</h1>
                    <div style="color:grey;font-size:20px;margin-top:20px">
                        <b>Period: ${periodRender}</b>
                        <br>
                        <b>Location: ${location}</b>
                        <br><br>
                        <b style="color:black;font-size:30px">Signups: ${signups}/${capacity}</b>
                        <br>
                        <button style="font-size:25px" class='signupTrigger' data-status=0 data-title='${title}' id='${title}' type='button'>Signup</button>
                    </div>
                    </div>`;
                }
                else if (render == "") {
                    render = `<div class="box">
                    <h1>${title}</h1>
                    <div style="color:grey;font-size:20px;margin-top:20px">
                        <b>Period: ${periodRender}</b>
                        <br>
                        <b>Location: ${location}</b>
                        <br><br>
                        <b style="color:black;font-size:30px">Signups: ${signups}/${capacity}</b>
                    </div>
                    </div>`;
                }
                console.log("attempting to render " + title);
                document.getElementById("p" + period).innerHTML = document.getElementById("p" + period).innerHTML + render;
            });
            document.querySelectorAll(".signupTrigger").forEach(btn => btn.addEventListener("click", () => { handleSignup(btn.dataset.title, btn.dataset.status); }));
        }
        async function renderStatus(data){
            if(data == 0){
                document.getElementById("warn").innerHTML = "Signups are not active. This page will automatically render the signups once they become active, there is no need to refresh.";
            }
            else if(data == 1){
                let uid = getCookie("uid");
                console.log("reading " + "/new/users/"+uid+"/access");
                let perms = await staticRead("/new/users/"+uid+"/access");
                console.log("read " + perms);
                if(perms == "early"){
                    document.getElementById("warn").innerHTML = "";
                    liveRead("new/workshops", renderWorkshops);
                }
                else{
                    document.getElementById("warn").innerHTML = "Signups are only active for workshop leaders. If you are a workshop leader, try refreshing the page a few times.";
                }
            }
            else if(data == 2){
                document.getElementById("warn").innerHTML = "";
                liveRead("new/workshops", renderWorkshops);
            }
            else if(data == 3){
                alert("Workshop signup is closed.");
                window.location.href = "/";
            }
            
        }
        
            if(await getCurrentUser() == null){
                document.getElementById("warn").innerHTML = "You must be signed in to sign up for workshops.";
                document.getElementById("p1").innerHTML = "";
                document.getElementById("p2").innerHTML = "";
                document.getElementById("p3").innerHTML = "";
                document.getElementById("p4").innerHTML = "";
            }
            else{
                liveRead("/new/state", renderStatus);
            }
    </script>
</head>

<body>
    <div class="navBar"><span class="logo" onclick="window.location.href='/'">U-High Artsfest</span><div class="navBarRight"><span class="navBarItem" onclick="window.location.href='/about.html'">About</span>|<span class="navBarItem" onclick="window.location.href ='/liveRender.html'">Workshop Signup</span>|<span id="name" class="navBarItem"></span>|<span id="auth" class="navBarItem"></span></div></div>
    <div class="infoContainer">
        <h3 class="title">Workshop Signup</h3>
        <p class="subTitle" id="warn">Rendering...</p>
    </div>
    <div class="gridContainer">
        <h1 style="font-size:45px;margin-bottom:20px">Period 1</h1>
        <div class="grid" id="p1">

        </div>
        <br>
        <h1 style="font-size:45px;margin-bottom:20px">Period 2</h1>
        <div class="grid" id="p2">

        </div>
        <br>
        <h1 style="font-size:45px;margin-bottom:20px">Double Period 1 + 2</h1>
        <div class="grid" id="p4">

        </div>
        <br>
        <h1 style="font-size:45px;margin-bottom:20px">Period 3</h1>
        <div class="grid" id="p3">

        </div>
    </div>
</body>

</html>
